# DayDreamer public-only Nginx entry.
# This file is intended to be copied to /etc/nginx/conf.d/bkgf-DayDreamer.conf.

limit_req_zone $binary_remote_addr zone=DayDreamer_api:10m rate=12r/m;

server {
    listen 80;
    server_name bkgf.net www.bkgf.net;

    add_header Referrer-Policy origin always;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bkgf.net www.bkgf.net;

    ssl_certificate /etc/letsencrypt/live/bkgf.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bkgf.net/privkey.pem;

    client_max_body_size 2m;
    add_header Referrer-Policy origin always;

    location = / {
        proxy_pass http://127.0.0.1:8000/DayDreamer;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /DayDreamer {
        proxy_pass http://127.0.0.1:8000/DayDreamer;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /DayDreamer/ {
        return 301 /DayDreamer;
    }

    location = /csrf-token {
        proxy_pass http://127.0.0.1:8000/csrf-token;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/DayDreamer/ {
        limit_req zone=DayDreamer_api burst=6 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Referrer-Policy;
        add_header X-Accel-Buffering no always;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /scripts/daydream-public.js {
        proxy_pass http://127.0.0.1:8000/scripts/daydream-public.js;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
    }

    location = /scripts/sse-core-stream.js {
        proxy_pass http://127.0.0.1:8000/scripts/sse-core-stream.js;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
    }

    location = /scripts/daydream-public.css {
        proxy_pass http://127.0.0.1:8000/scripts/daydream-public.css;
        proxy_http_version 1.1;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy origin always;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
