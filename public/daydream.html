<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DayDream 世界引擎</title>
    <link rel="stylesheet" href="/scripts/daydream-public.css">
</head>
<body>
    <div id="daydream_public_app" class="dd-app">
        <div class="dd-shell">
            <header class="dd-header">
                <div>
                    <h1 id="dd_story_title">DayDream</h1>
                    <span id="dd_story_class">世界引擎</span>
                </div>
                <button id="dd_open_setup" class="dd-icon-btn" title="选择故事">设置</button>
            </header>

            <section id="dd_stats" class="dd-stats"></section>

            <main id="dd_content" class="dd-content"></main>

            <section class="dd-action-bar">
                <input id="dd_custom_action" type="text" placeholder="输入自定义行动..." autocomplete="off">
                <button id="dd_send_action" title="发送">发送</button>
            </section>

            <nav id="dd_tabs" class="dd-tabs"></nav>

            <div id="dd_modal" class="dd-modal" hidden></div>
        </div>
    </div>

    <script>
        window.addEventListener('error', function (event) {
            const target = event.target;
            if (target instanceof HTMLScriptElement && target.src.includes('/scripts/daydream-public.js')) {
                const content = document.getElementById('dd_content');
                if (content) {
                    content.innerHTML = '<section class="dd-card"><div class="dd-error">DayDream 脚本加载失败，请检查 Nginx 静态资源白名单。</div></section>';
                }
            }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
            const content = document.getElementById('dd_content');
            if (content && !content.textContent.trim()) {
                const message = event.reason && event.reason.message ? event.reason.message : '未知错误';
                content.innerHTML = '<section class="dd-card"><div class="dd-error">DayDream 启动失败：' + String(message).replace(/[<>&"]/g, '') + '</div></section>';
            }
        });
    </script>
    <script type="module" src="/scripts/daydream-public.js"></script>
</body>
</html>
