<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DayDreamer 世界引擎</title>
    <link rel="stylesheet" href="/scripts/daydream-public.css">
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wfljfphcze");
    </script>
</head>
<body>
    <div id="DayDreamer_public_app" class="dd-app">
        <div class="dd-shell">
            <header class="dd-header">
                <div class="dd-title-stack">
                    <div id="dd_home_link" class="dd-brand" role="button" tabindex="0" aria-label="返回故事库" title="返回故事库">
                        <span class="dd-brand-name">DayDreamer</span>
                        <span class="dd-brand-type">世界引擎</span>
                    </div>
                    <h1 id="dd_story_title">DayDreamer</h1>
                    <span id="dd_story_class" class="dd-story-class">世界引擎</span>
                </div>
                <div class="dd-header-actions">
                    <button id="dd_open_wechat_group" class="dd-top-action" title="微信交流群">交流群</button>
                    <button id="dd_quick_random" class="dd-top-action" title="随机开始">随机开始</button>
                    <button id="dd_quick_custom" class="dd-top-action" title="自定义游戏">自定义游戏</button>
                    <button id="dd_open_setup" class="dd-icon-btn" title="故事库">故事库</button>
                </div>
            </header>

            <section id="dd_stats" class="dd-stats"></section>

            <main id="dd_content" class="dd-content"></main>

            <section class="dd-action-bar">
                <input id="dd_custom_action" type="text" placeholder="输入自定义行动..." autocomplete="off">
                <button id="dd_send_action" title="发送">发送</button>
            </section>

            <nav id="dd_tabs" class="dd-tabs"></nav>

            <div id="dd_modal" class="dd-modal" hidden></div>
        </div>
    </div>

    <script>
        window.addEventListener('error', function (event) {
            const target = event.target;
            if (target instanceof HTMLScriptElement && target.src.includes('/scripts/daydream-public.js')) {
                const content = document.getElementById('dd_content');
                if (content) {
                    content.innerHTML = '<section class="dd-card"><div class="dd-error">DayDreamer 脚本加载失败，请检查 Nginx 静态资源白名单。</div></section>';
                }
            }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
            const content = document.getElementById('dd_content');
            if (content && !content.textContent.trim()) {
                const message = event.reason && event.reason.message ? event.reason.message : '未知错误';
                content.innerHTML = '<section class="dd-card"><div class="dd-error">DayDreamer 启动失败：' + String(message).replace(/[<>&"]/g, '') + '</div></section>';
            }
        });
    </script>
    <script type="module" src="/scripts/daydream-public.js"></script>
</body>
</html>
